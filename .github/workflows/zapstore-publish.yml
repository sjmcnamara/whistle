name: Zapstore publish

# Deliberately manual: publishing broadcasts signed Nostr events to public
# relays under a real identity. Trigger this yourself once you've confirmed
# the GitHub release (created by the "Android release" workflow) looks right
# — there is no automatic trigger on tag push.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 'stable'

      - name: Install zsp
        run: go install github.com/zapstore/zsp@latest

      - name: Publish latest release to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "::error::ZAPSTORE_NSEC secret is not set"
            exit 1
          fi
          zsp publish zapstore.yaml -q

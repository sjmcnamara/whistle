name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. Jobs that need write access declare it explicitly.
permissions: read-all

jobs:
  # ──────────────────────────────────────────────
  # iOS — WhistleCore SPM Tests (pure Swift, fast)
  # ──────────────────────────────────────────────
  ios-core-tests:
    name: WhistleCore Tests
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Run SPM tests
        run: cd WhistleCore && swift test --enable-code-coverage

      - name: Generate coverage report
        continue-on-error: true
        working-directory: WhistleCore
        run: |
          BIN_PATH=$(swift build --show-bin-path 2>/dev/null)
          PROFDATA="${BIN_PATH}/codecov/default.profdata"
          BUNDLE=$(find "${BIN_PATH}" -name "*.xctest" -print -quit 2>/dev/null)
          if [ -f "$PROFDATA" ] && [ -n "$BUNDLE" ]; then
            EXEC="${BUNDLE}/Contents/MacOS/$(basename "${BUNDLE}" .xctest)"
            xcrun llvm-cov export "$EXEC" \
              -instr-profile="$PROFDATA" \
              -format=lcov \
              --ignore-filename-regex="\.build|Tests" \
              > coverage.lcov
          else
            echo "Coverage data not found — skipping"
          fi

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: WhistleCore/coverage.lcov
          flags: whistlecore
          fail_ci_if_error: false

  # ──────────────────────────────────────────────
  # iOS — Full app build + test
  # ──────────────────────────────────────────────
  ios-tests:
    name: iOS Build & Test
    runs-on: macos-15
    permissions:
      contents: read
      actions: write  # upload-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache DerivedData
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ hashFiles('Sources/**', 'WhistleCore/**', 'WhistleTests/**', 'project.yml', 'MarmotKitBindings/**') }}
          restore-keys: derived-data-

      # MarmotKit's release XCFramework has to be vendored and repackaged
      # locally, not resolved from its remote URL — see
      # scripts/vendor_marmotkit.py for why (swift-build#1746 modulemap
      # collision with NostrSDK's own xcframework). Cache the downloaded zip
      # rather than the 347MB extracted tree: re-extracting is seconds, and
      # the script skips the download whenever the verified zip is present.
      - name: Resolve MarmotKit version
        id: marmotkit-ver
        run: echo "version=$(python3 scripts/vendor_marmotkit.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: Cache MarmotKit XCFramework zip
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: vendor/MarmotKitFFI-${{ steps.marmotkit-ver.outputs.version }}.xcframework.zip
          key: marmotkit-ffi-${{ steps.marmotkit-ver.outputs.version }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          python3 scripts/vendor_marmotkit.py
          xcodegen generate

      - name: Boot simulator
        run: |
          SIM_ID=$(python3 scripts/ci_pick_simulator.py)
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true

      - name: Build & Test
        run: |
          xcodebuild test \
            -project Whistle.xcodeproj \
            -scheme Whistle \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:WhistleTests \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            | xcpretty --color || true

      - name: Generate coverage report
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.json
          flags: ios
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: failure()
        with:
          name: ios-test-results
          path: TestResults.xcresult

  # ──────────────────────────────────────────────
  # Android — Unit tests (shared + app)
  # ──────────────────────────────────────────────
  android-tests:
    name: Android Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      # Verifies gradle/wrapper/gradle-wrapper.jar against Gradle's published
      # checksums — supply-chain hardening for the one binary we must vendor,
      # and it clears the wrapper jar from the OpenSSF Scorecard binary check.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Shared module tests
        working-directory: android
        run: ./gradlew :shared:test

      - name: App unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Generate coverage report
        working-directory: android
        run: ./gradlew :app:createDebugUnitTestCoverageReport

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: android/app/build/reports/coverage/test/debug/report.xml
          flags: android
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: failure()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/

  # ──────────────────────────────────────────────
  # SwiftLint
  # ──────────────────────────────────────────────
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  # ──────────────────────────────────────────────
  # Dependency Review (PR only)
  # ──────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write  # post review comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
      # The hero version is injected from project.yml at build time, so a
      # version bump must redeploy the site or it silently shows the old one.
      - 'project.yml'
  workflow_dispatch:

# Least privilege: only the deploy job needs pages/id-token write.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r requirements.txt
      # Single source of truth for the version shown on the site: project.yml.
      # mkdocs.yml reads it via `!ENV [APP_VERSION, "dev"]`.
      - name: Derive app version from project.yml
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: *"\([^"]*\)".*/\1/p' ../project.yml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Could not read MARKETING_VERSION from project.yml"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Site will show v$version"
      - run: mkdocs build --strict
      # MkDocs strips dot-directories, so place the RFC 9116 security.txt into
      # the built site directly (canonical /.well-known/ path). Runs after the
      # build, which wipes site/.
      - name: Publish security.txt (RFC 9116)
        run: install -D .well-known/security.txt site/.well-known/security.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: website/site
          # Default excludes dot-directories (--exclude=.[^/]*), which drops
          # .well-known/. Needed so /.well-known/security.txt is published.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5

name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 08:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-15
          - language: kotlin
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # ── Swift: install tooling BEFORE CodeQL init ─
      # brew install fails under Rosetta after CodeQL modifies the shell
      # environment for Swift tracing, so xcodegen + mdk-swift must be
      # set up before CodeQL initialises.
      - name: Install xcodegen (Swift)
        if: matrix.language == 'swift'
        run: brew install xcodegen

      - name: Clone mdk-swift with LFS (Swift)
        if: matrix.language == 'swift'
        run: |
          git lfs install
          git clone --depth 1 https://github.com/marmot-protocol/mdk-swift.git vendor/mdk-swift
          (cd vendor/mdk-swift && git lfs pull) || true
          python3 scripts/ci_use_local_mdk.py

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4
        with:
          languages: ${{ matrix.language }}
          db-location: ~/.codeql/databases

      # ── Swift ────────────────────────────────────
      - name: Generate Xcode project (Swift)
        if: matrix.language == 'swift'
        run: xcodegen generate

      - name: Build (Swift)
        if: matrix.language == 'swift'
        run: |
          xcodebuild build \
            -project Whistle.xcodeproj \
            -scheme Whistle \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      # ── Kotlin ───────────────────────────────────
      - name: Set up Java (Kotlin)
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build (Kotlin)
        if: matrix.language == 'kotlin'
        working-directory: android
        run: ./gradlew assembleDebug

      # ── Analysis ─────────────────────────────────
      - name: Cache CodeQL database
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: ~/.codeql/databases
          key: codeql-${{ matrix.language }}-${{ github.sha }}
          restore-keys: codeql-${{ matrix.language }}-

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4
        with:
          category: "/language:${{ matrix.language }}"
          db-location: ~/.codeql/databases

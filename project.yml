name: Whistle

options:
  bundleIdPrefix: org.getwhistle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.1"
  createIntermediateGroups: true
  groupSortPosition: top
  indentWidth: 4
  tabWidth: 4

packages:
  WhistleCore:
    path: WhistleCore
  NostrSDK:
    url: https://github.com/rust-nostr/nostr-sdk-swift
    exactVersion: "0.44.8"
  MDKBindings:
    url: https://github.com/marmot-protocol/mdk-swift
    revision: 8a7a0a59208e28f721a3abd16c9bd2c0d12af0be
  QRCode:
    url: https://github.com/dagronf/QRCode
    exactVersion: "9.2.1"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Whistle:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WhistleCore
      - package: NostrSDK
      - package: MDKBindings
      - package: QRCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.getwhistle.whistle
        DEVELOPMENT_TEAM: 3V55494FNM
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.8.14"
        CURRENT_PROJECT_VERSION: "61"
        PRODUCT_NAME: Whistle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/Whistle.entitlements
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Whistle
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocationWhenInUseUsageDescription: "Whistle needs your location to share it with your group."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Whistle needs background location access to keep your group updated when the app is in the background."
        NSMotionUsageDescription: "Whistle uses motion data to detect when you're stationary and reduce battery usage."
        NSFaceIDUsageDescription: "Whistle uses Face ID to unlock the app and protect your group data."
        NSCameraUsageDescription: "Whistle uses the camera to scan QR invite codes."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
            - whistle
            CFBundleURLName: org.getwhistle.whistle
        UIBackgroundModes:
          - location
          - fetch

  WhistleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhistleTests
    dependencies:
      - target: Whistle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.getwhistle.whistle.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Whistle:
    build:
      targets:
        Whistle: all
        WhistleTests: [test]
    test:
      targets:
        - WhistleTests
